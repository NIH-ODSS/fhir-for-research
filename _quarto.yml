project:
  type: website
  output-dir: public
  post-render: sh post-render.sh # Refresh role maps after full builds without rescanning inputs.
  render:
    - "*.qmd"
    - "!cache/" # naming this _cache should work instead, but did not in testing https://community.rstudio.com/t/quarto-equivalent-to-exclude-yaml-command-in-distill/148758/2
    - "!README.md"
    - "!script/"
  resources:
    - /pyproject.toml
    - /workshops/bulk-data/synthea_10.ndjson
    - "/modules/**/*.ipynb"
    - "/workshops/**/*.ipynb"

  preview:
    watch-inputs: true # Only rebuild when inputs change
    navigate: true # Navigate without full reloads
    port: 1414 # Fixed port avoids re‑starts
    browser: false # Don’t auto‑open browser each time

csl: ieee.csl

website:
  title: "FHIR® for Research"
  site-url: https://nih-odss.github.io/fhir-for-research/
  repo-url: https://github.com/nih-odss/fhir-for-research/
  repo-actions: [issue]
  open-graph: true
  search:
    location: navbar
    type: textbox
  navbar:
    left:
      - text: Introduction
        file: sections/introduction.qmd
      - text: Technologies
        file: sections/technologies.qmd
      - text: Hands-on <span class="collapse-lg-xl">Practice</span>
        file: sections/hands-on-practice.qmd
      - text: Hosting Your Own Workshop
        file: sections/hosting-your-own-workshop.qmd

    right:
      - href: contribute.qmd
        text: <span class="collapse-lg-xl">Questions & Contributions</span>
        icon: question-circle-fill
      - icon: github
        href: https://github.com/NIH-ODSS/fhir-for-research
        text: <span class="collapse-sm">View on GitHub</span>
        aria-label: View the GitHub repository for this site

  sidebar:
    - id: Introduction
      title: Overview
      style: floating
      search: false
      align: left
      collapse-level: 3
      contents:
        - file: sections/introduction.qmd
          text: "Introduction"
        - section: "FHIR for Research"
          contents:
            - section: "What is FHIR?"
              contents:
                - modules/fhir-from-10000-ft.qmd
                - modules/fhir-from-1000-ft.qmd
