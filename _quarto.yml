format:
  html:
    filters:
      - lua/modules-flag.lua
      - lua/environment-banner.lua
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    highlight-style: a11y
    css: styles.css
    toc: true
    include-in-header: head.html
    include-after-body:
      - scripts.html
    template-partials:
      - title-block.html
